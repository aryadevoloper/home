
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Loading...</title>
    <style>
        body {
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        .logo {
            width: 120px;
            height: 120px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            margin-bottom: 40px;
            object-fit: cover;
            animation: pulse 2s infinite;
        }
        .loader {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        .status {
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <img src="logo.png" class="logo" />
    <div class="loader"></div>
    <div class="status" id="statusText">Connecting securely...</div>

    <script>
        const TARGET_URL = "http://xyzzviipp.mamhost.biz.id:3132";
        
        function checkConnection() {
            const status = document.getElementById('statusText');
            
            if (navigator.onLine) {
                status.innerText = "Launching Application...";
                // Beri jeda sedikit agar animasi terlihat (kesan smooth)
                setTimeout(() => {
                    window.location.replace(TARGET_URL);
                }, 1500);
            } else {
                status.innerText = "No Internet Connection. Retrying...";
                status.style.color = "red";
                setTimeout(checkConnection, 3000);
            }
        }

        // Jalankan saat device siap
        document.addEventListener('deviceready', function() {
            if (navigator.splashscreen) {
                navigator.splashscreen.hide(); // Sembunyikan splash native, ganti ke HTML ini
            }
            checkConnection();
        }, false);

        // Fallback jika cordova tidak terdeteksi
        setTimeout(checkConnection, 1000);
    </script>
</body>
</html>
